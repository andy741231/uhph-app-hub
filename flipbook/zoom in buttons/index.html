<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoom In Buttons</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1 class="page-title">Zoom In Buttons</h1>
    <p class="page-subtitle">Hover over any card to zoom the image and text.</p>

    <section class="button-grid" aria-label="Zoom image buttons">
      <a href="#" class="zoom-button" data-label="Mountains">
        <span class="zoom-button__bg" style="background-image: url('https://picsum.photos/id/1015/600/400');"></span>
        <span class="zoom-button__overlay"></span>
        <span class="zoom-button__text">Mountains</span>
      </a>

      <a href="#" class="zoom-button" data-label="Ocean">
        <span class="zoom-button__bg" style="background-image: url('https://picsum.photos/id/1016/600/400');"></span>
        <span class="zoom-button__overlay"></span>
        <span class="zoom-button__text">Ocean</span>
      </a>

      <a href="#" class="zoom-button" data-label="Forest">
        <span class="zoom-button__bg" style="background-image: url('https://picsum.photos/id/1023/600/400');"></span>
        <span class="zoom-button__overlay"></span>
        <span class="zoom-button__text">Forest</span>
      </a>

      <a href="#" class="zoom-button" data-label="City">
        <span class="zoom-button__bg" style="background-image: url('https://picsum.photos/id/1033/600/400');"></span>
        <span class="zoom-button__overlay"></span>
        <span class="zoom-button__text">City</span>
      </a>

      <a href="#" class="zoom-button" data-label="Desert">
        <span class="zoom-button__bg" style="background-image: url('https://picsum.photos/id/1044/600/400');"></span>
        <span class="zoom-button__overlay"></span>
        <span class="zoom-button__text">Desert</span>
      </a>

      <a href="#" class="zoom-button" data-label="Aurora">
        <span class="zoom-button__bg" style="background-image: url('https://picsum.photos/id/1056/600/400');"></span>
        <span class="zoom-button__overlay"></span>
        <span class="zoom-button__text">Aurora</span>
      </a>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
