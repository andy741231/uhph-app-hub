<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Partners Manager</title>
    <link rel="stylesheet" href="static/css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-content">
                <div class="navbar-brand">
                    <svg class="navbar-logo" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 0 0-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 0 1 5.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 0 1 9.288 0M15 7a3 3 0 1 1-6 0 3 3 0 0 1 6 0zm6 3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zM7 10a2 2 0 1 1-4 0 2 2 0 0 1 4 0z"></path>
                    </svg>
                    <span class="navbar-title">Community Partners Manager</span>
                </div>
                <div class="navbar-nav">
                    <a href="dashboard.html" class="nav-link">Dashboard</a>
                    <a href="index.html" class="nav-link nav-link-active">View Partners</a>
                </div>
                <div class="navbar-actions">
                   <button class="btn btn-primary" onclick="app.openAddModal()">
                    <i data-lucide="plus" class="icon-small"></i>
                    New Partner
                </button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container">
        
        <div class="controls">
             <div class="filter-group">
                <select id="itemsPerPage">
                    <option value="9" selected>9 per page</option>
                    <option value="25">25 per page</option>
                    <option value="50">50 per page</option>
                    <option value="100">100 per page</option>
                    <option value="250">250 per page</option>
                    <option value="500">500 per page</option>
                    <option value="all">All items</option>
                </select>
                <select id="sortBy">
                    <option value="orgName-asc">Sort by Org Name (A-Z)</option>
                    <option value="orgName-desc">Sort by Org Name (Z-A)</option>
                </select>
                <button id="viewToggleBtn" class="btn btn-light" onclick="app.toggleView()" title="Toggle view">
                    <span id="viewToggleText">Table View</span>
                </button>
            </div>
           
            
            <div class="action-group">
                <div class="search-wrapper">
                    <input type="text" id="searchInput" placeholder="Search partners..." class="form-input search-input">
                    <i data-lucide="search" class="search-icon"></i>
                </div>
                
            </div>
        </div>
        

        <div id="statsGrid" class="stats-grid">
        </div>

        <div id="partnersGrid" class="events-grid">
            <div class="loading">Loading partners...</div>
        </div>

        <div id="partnersTable" class="table-view" style="display: none;">
            <div class="table-card">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Organization Name</th>
                                <th>Contact</th>
                                <th>Type</th>
                                <th>PI</th>
                                <th>City</th>
                                <th>State</th>
                                <th>MOU Status</th>
                            </tr>
                        </thead>
                        <tbody id="partnersTableBody">
                            <tr>
                                <td colspan="7" class="loading">Loading partners...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="pagination-container" id="paginationControls">
        </div>
    </div>

    <div id="editModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Edit Community Partner</h2>
                <button class="close-btn" onclick="app.closeModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="partnerId">
                    
                    <div class="form-group">
                        <label class="form-label">Org Name</label>
                        <input type="text" id="orgName" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Org Contact (and Title)</label>
                        <textarea id="orgContact" class="form-textarea" style="min-height: 80px;"></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">PI</label>
                        <select id="pi" class="form-select">
                            <option value="">Select PI...</option>
                            <option value="Karami">Karami</option>
                            <option value="Carmack">Carmack</option>
                            <option value="Cepni">Cepni</option>
                            <option value="custom">+ Add new...</option>
                        </select>
                        <input type="text" id="piCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new PI">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Neighborhood</label>
                        <select id="neighborhood" class="form-select">
                            <option value="">Select neighborhood...</option>
                            <option value="custom">+ Add new...</option>
                        </select>
                        <input type="text" id="neighborhoodCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new neighborhood">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select id="status" class="form-select">
                            <option value="">Select status...</option>
                            <option value="custom">+ Add new...</option>
                        </select>
                        <input type="text" id="statusCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new status">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Org Type</label>
                        <select id="orgType" class="form-select">
                            <option value="">Select type...</option>
                            <option value="Health Organization">Health Organization</option>
                            <option value="Educational Institution">Educational Institution</option>
                            <option value="Faith-Based Organization">Faith-Based Organization</option>
                            <option value="Community-Based/Health Organization">Community-Based/Health Organization</option>
                            <option value="Community-Based Organization">Community-Based Organization</option>
                            <option value="Government Institution">Government Institution</option>
                            <option value="Grassroots Organization">Grassroots Organization</option>
                            <option value="Community-Based Research Organization">Community-Based Research Organization</option>
                            <option value="Faith-Based/Community-Based Organization">Faith-Based/Community-Based Organization</option>
                            <option value="Community-Based/Workforce Development Organization">Community-Based/Workforce Development Organization</option>
                            <option value="custom">+ Add new...</option>
                        </select>
                        <input type="text" id="orgTypeCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new Org Type">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Address</label>
                        <textarea id="address" class="form-textarea" style="min-height: 80px;"></textarea>
                    </div>

                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="form-label">City</label>
                            <select id="city" class="form-select">
                                <option value="">Select city...</option>
                                <option value="Atlanta">Atlanta</option>
                                <option value="Houston">Houston</option>
                                <option value="Columbus">Columbus</option>
                                <option value="custom">+ Add new...</option>
                            </select>
                            <input type="text" id="cityCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new City">
                        </div>
                        <div>
                            <label class="form-label">State</label>
                            <select id="state" class="form-select">
                                <option value="">Select state...</option>
                                <option value="Georgia">Georgia</option>
                                <option value="Texas">Texas</option>
                                <option value="Ohio">Ohio</option>
                                <option value="custom">+ Add new...</option>
                            </select>
                            <input type="text" id="stateCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new State">
                        </div>
                    </div>

                    <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div>
                            <label class="form-label">Postal Code</label>
                            <input type="number" id="postalCode" class="form-input">
                        </div>
                        <div>
                            <label class="form-label">Country</label>
                            <select id="country" class="form-select">
                                <option value="United States">United States</option>
                                <option value="custom">+ Add new...</option>
                            </select>
                            <input type="text" id="countryCustom" class="form-input" style="display: none; margin-top: 8px;" placeholder="Enter new Country">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">with MOUs/Subaward?</label>
                        <select id="mouStatus" class="form-select">
                            <option value="">Select status...</option>
                            <option value="Formal (MOU)">Formal (MOU)</option>
                            <option value="Non-Formal">Non-Formal</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="app.savePartner()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="notificationModal" class="modal-overlay" style="display: none;">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2 class="modal-title" id="notificationTitle">Notification</h2>
                <button class="close-btn" onclick="app.closeNotificationModal()">×</button>
            </div>
            <div class="modal-body">
                <p id="notificationMessage" class="notification-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="app.closeNotificationModal()">OK</button>
            </div>
        </div>
    </div>

    <script src="static/js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
